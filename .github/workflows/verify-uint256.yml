name: Verify UInt256

on:
  pull_request:
    paths:
      - 'src/**'
      - 'verification/**'
      - 'global.json'
      - '.editorconfig'
      - '*.props'
      - '*.targets'
      - '*.config'
      - '*.Config'
      - '.github/workflows/verify-uint256.yml'
      - '.github/workflows/verify-uint256-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'verification/**'
      - 'global.json'
      - '.editorconfig'
      - '*.props'
      - '*.targets'
      - '*.config'
      - '*.Config'
      - '.github/workflows/verify-uint256.yml'
      - '.github/workflows/verify-uint256-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Select complete API and feature coverage
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Require all selected API proof gates
        id: plan
        run: |
          dotnet build verification/Runner -c Release --nologo
          matrix=$(dotnet verification/Runner/bin/Release/net10.0/Verification.dll plan --expanded --safety)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  verify:
    needs: plan
    name: Production proof (${{ matrix.method }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_EnableHWIntrinsic: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Detect changes to verified methods
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_EVENT: ${{ github.event_name }}
          VERIFY_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          dotnet run --project verification/Runner.Tests -c Release -- change-checks
          dotnet run --project verification/Runner -c Release -- changes --method ${{ matrix.method }} --profile ${{ matrix.profile }}
      - name: Install Lean 4.34.1
        if: steps.changes.outputs.required == 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Verify UInt256 arithmetic and memory safety
        if: steps.changes.outputs.required == 'true'
        run: dotnet run --project verification/Runner -c Release -- verify --method ${{ matrix.method }} --profile ${{ matrix.profile }} --safety
