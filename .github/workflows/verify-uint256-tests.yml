name: Verify UInt256 proof tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_EnableHWIntrinsic: '0'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  plan:
    name: Select the complete regression matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Select every required regression group
        id: plan
        run: |
          dotnet run --project verification/Runner -c Release -- regressions --print-plan --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/regression-plan.json"
  regressions:
    name: Regression batch (${{ matrix.batch }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Install Lean 4.34.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Run every exact regression group in the batch
        env:
          REGRESSION_JOBS: ${{ toJSON(matrix.jobs) }}
        run: |
          dotnet run --project verification/Runner -c Release -- regressions --batch "$REGRESSION_JOBS"
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uint256-regression-batch-${{ matrix.batch }}
          path: verification/generated/all-checks/run-*/
  coverage:
    name: Complete selected API feature coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Install Lean 4.34.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Verify all full family contracts and compose coverage
        run: dotnet run --project verification/Runner -c Release -- verify-all --expanded --safety --jobs 2
      - name: Retain coverage certificates and artifact identities
        uses: actions/upload-artifact@v6
        with:
          name: uint256-complete-coverage
          path: verification/generated/**/report.json
      - name: Retain aggregate certificate
        uses: actions/upload-artifact@v6
        with:
          name: uint256-coverage-composition
          path: verification/generated/safety/coverage.json
