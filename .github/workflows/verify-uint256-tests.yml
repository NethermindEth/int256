name: Verify UInt256 proof tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_EnableHWIntrinsic: '0'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  plan:
    name: Select the complete regression matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Select every required regression group
        id: plan
        run: |
          python3 verification/Tests/all_checks.py --print-plan > "$RUNNER_TEMP/regression-plan.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "regression-plan.json").read_text())
          if plan["scope"] != "full" or len(plan["jobs"]) != plan["requiredJobs"]:
              raise RuntimeError("Incomplete regression selection")
          matrix = {"include": [{"job": job["id"]} for job in plan["jobs"]]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
          PY
  regressions:
    name: Regression (${{ matrix.job }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Install Lean 4.34.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Run the exact regression group
        run: python3 verification/Tests/all_checks.py --job ${{ matrix.job }}
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: uint256-regression-${{ matrix.job }}
          path: verification/generated/all-checks/run-*/
  coverage:
    name: Complete selected API feature coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Install Lean 4.34.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Verify all full family contracts and compose coverage
        run: python3 verification/verify_all.py --expanded --jobs 2
      - name: Retain coverage certificates and artifact identities
        uses: actions/upload-artifact@v6
        with:
          name: uint256-complete-coverage
          path: verification/generated/**/report.json
      - name: Retain aggregate certificate
        uses: actions/upload-artifact@v6
        with:
          name: uint256-coverage-composition
          path: verification/generated/coverage.json
