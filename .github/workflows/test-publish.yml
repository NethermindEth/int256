name: Test / Publish

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: 'No'
        type: choice
        options:
          - 'No'
          - Staging
          - Production

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build-config: debug
            intrinsics: HWIntrinsics
            avx2: Avx2
          - os: macos-latest
            build-config: debug
            intrinsics: HWIntrinsics
            avx2: NoAvx2
          - os: ubuntu-latest
            build-config: debug
            intrinsics: HWIntrinsics
            avx2: NoAvx2

          - os: windows-latest
            build-config: release
            intrinsics: NoHWIntrinsics
            avx2: NoAvx2
          - os: windows-latest
            build-config: release
            intrinsics: HWIntrinsics
            avx2: Avx2

          - os: macos-latest
            build-config: release
            intrinsics: NoHWIntrinsics
            avx2: NoAvx2
          - os: macos-latest
            build-config: release
            intrinsics: HWIntrinsics
            avx2: NoAvx2

          - os: ubuntu-latest
            build-config: release
            intrinsics: HWIntrinsics
            avx2: Avx2
          - os: ubuntu-latest
            build-config: release
            intrinsics: HWIntrinsics
            avx2: NoAvx2
          - os: ubuntu-latest
            build-config: release
            intrinsics: NoHWIntrinsics
            avx2: NoAvx2
          - os: ubuntu-latest
            build-config: release
            intrinsics: NoHWIntrinsics
            avx2: NoAvx2
            variant: zkevm

          # linux-arm64: validates the AdvSimd paths on the production ARM target
          # (the AVX2/AVX-512 env toggles are no-ops there).
          - os: ubuntu-24.04-arm
            build-config: release
            intrinsics: HWIntrinsics
            avx2: NoAvx2
          - os: ubuntu-24.04-arm
            build-config: release
            intrinsics: NoHWIntrinsics
            avx2: NoAvx2

    env:
      DOTNET_EnableAVX2: ${{ matrix.avx2 == 'NoAvx2' && '0' || '1' }}
      DOTNET_EnableHWIntrinsic: ${{ matrix.intrinsics == 'NoHWIntrinsics' && '0' || '1' }}
      ENABLE_ZKEVM: ${{ matrix.variant == 'zkevm' && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Test
        working-directory: src/Nethermind.Int256.Tests
        run: dotnet test -c ${{ matrix.build-config }} -p:EnableZkEvm=${{ env.ENABLE_ZKEVM }}

  publish:
    name: Publish
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'No' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_HOST: ${{ github.event.inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_HOST }}
          token-service-url: ${{ env.NUGET_HOST }}/api/v2/token

      - name: Publish
        env:
          DOTNET_EnableAVX2: 1
          DOTNET_EnableHWIntrinsic: 1
          NUGET_API_KEY: ${{ github.event.inputs.publish == 'Staging' && secrets.NUGETTEST_API_KEY || secrets.NUGET_API_KEY }}
        working-directory: src
        run: |
          set -euo pipefail
          dotnet pack ./Nethermind.Int256/Nethermind.Int256.csproj -c release
          nupkg=$(ls ./artifacts/package/release/*.nupkg | head -1)
          snupkg=$(ls ./artifacts/package/release/*.snupkg | head -1)
          echo "Verifying $nupkg and $snupkg"
          for f in impl/std/net10.0/Nethermind.Int256.dll impl/zkevm/net10.0/Nethermind.Int256.dll; do
            unzip -l "$nupkg" | grep -qF "$f" || { echo "::error::missing $f in $(basename "$nupkg")"; exit 1; }
          done
          for f in impl/std/net10.0/Nethermind.Int256.pdb impl/zkevm/net10.0/Nethermind.Int256.pdb; do
            unzip -l "$snupkg" | grep -qF "$f" || { echo "::error::missing $f in $(basename "$snupkg")"; exit 1; }
          done
          dotnet nuget push "$nupkg" \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_HOST }}/api/v2/package
