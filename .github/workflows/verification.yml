name: UInt256 verification contracts

on:
  pull_request:
    paths:
      - verification/**
      - .github/workflows/verification.yml
  push:
    branches: [main]
    paths:
      - verification/**
      - .github/workflows/verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts and supporting theorem audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: verification
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build contracts and audit supporting theorems
        shell: pwsh
        run: ./verification/Verify.ps1 -Action Contracts
