name: UInt256 verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select verification gates
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.gates.outputs.contracts }}
      matrix: ${{ steps.gates.outputs.matrix }}
      count: ${{ steps.gates.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - id: gates
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dotnet run --file verification/TestVerification.cs
          if ($LASTEXITCODE -ne 0) { throw 'Verification runner regression checks failed' }
          dotnet run --file verification/SelectGates.cs -- --event "$env:EVENT_NAME" --base "$env:BASE_SHA" --head "$env:HEAD_SHA" --output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'Gate selection failed' }

  contracts:
    name: Contracts and supporting theorem audit
    needs: select
    if: needs.select.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: verification
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build contracts and audit supporting theorems
        shell: pwsh
        run: dotnet run --file verification/Verify.cs -- --action contracts

  prepare:
    name: Prepare certified LeanCIL library
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest-sha256: ${{ steps.certify.outputs.manifest-sha256 }}
      artifact-id: ${{ steps.library.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: verification
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and kernel-check shared library
        id: certify
        shell: pwsh
        working-directory: verification
        run: |
          lake update
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
          dotnet run --file .lake/packages/leancil/scripts/PrepareLibrary.cs -- artifacts/certified-library
          if ($LASTEXITCODE -ne 0) { throw 'Library certification failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: library
        with:
          name: certified-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/artifacts/certified-library
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Certificates (${{ matrix.id }})
    needs: [select, prepare]
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
      LEANCIL_CERTIFIED_LIBRARY: ${{ github.workspace }}/verification/artifacts/certified-library
      LEANCIL_CERTIFIED_LIBRARY_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
      LEANCIL_TRACE_DIRECTORY: ${{ github.workspace }}/verification/artifacts/verification-traces
      LEANCIL_SUITE: ${{ matrix.id }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: verification
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: verification/artifacts/certified-library
      - name: Verify compiled methods
        id: certificate
        shell: pwsh
        env:
          VERIFY_METHODS: ${{ toJSON(matrix.methods) }}
          VERIFY_PROFILE: ${{ matrix.profile }}
        run: dotnet run --file verification/Verify.cs -- --action verify --methods-json "$env:VERIFY_METHODS" --profile "$env:VERIFY_PROFILE"
      - name: Summarize verification timings
        if: always() && steps.certificate.outcome != 'skipped'
        shell: pwsh
        working-directory: verification
        run: |
          dotnet run --file .lake/packages/leancil/scripts/SummarizeVerification.cs -- --root artifacts/verification-traces --output artifacts/timings.json --markdown artifacts/timings.md --github-summary
          if ($LASTEXITCODE -ne 0) { throw 'Timing summary failed' }
      - name: Retain timings and command transcripts
        if: always() && steps.certificate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            verification/artifacts/verification-traces
            verification/artifacts/timings.json
            verification/artifacts/timings.md
          if-no-files-found: warn
          retention-days: 7

  verification:
    name: Verify UInt256
    needs: [select, contracts, prepare, verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected verification check
        shell: pwsh
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          CONTRACTS_SELECTED: ${{ needs.select.outputs.contracts }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CERTIFICATE_COUNT: ${{ needs.select.outputs.count }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if ($env:SELECT_RESULT -ne 'success') { throw 'Gate selection failed' }
          if ($env:CONTRACTS_SELECTED -eq 'true' -and $env:CONTRACTS_RESULT -ne 'success') {
            throw 'Contract audit did not pass'
          }
          if ([int]$env:CERTIFICATE_COUNT -gt 0 -and $env:VERIFY_RESULT -ne 'success') {
            throw 'A selected certificate did not pass'
          }
          if ([int]$env:CERTIFICATE_COUNT -gt 0 -and $env:PREPARE_RESULT -ne 'success') {
            throw 'Shared library certification did not pass'
          }
          'All selected verification checks passed.'
